# Backup for src/keep-awake.ts. The app keeps itself awake, but it cannot wake itself if it
# ever does stop, for example after a Render restart. GitHub can delay scheduled runs, so
# this is not reliable enough alone. Minutes are off the hour, when GitHub is less loaded.
name: Keep awake

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the health endpoint
        run: curl --silent --show-error --fail --max-time 120 --retry 2 https://carecloud-voice-agent-3h0y.onrender.com/health
